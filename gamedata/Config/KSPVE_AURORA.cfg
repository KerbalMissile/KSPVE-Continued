// KSPVE aurorae and airglow: one BODY node per body that has a magnetosphere, a crust that is magnetised, or an atmosphere that
// glows. Bodies that are not listed but have an atmosphere are given a model by a rule (see AuroraBodyModel.Guess): the
// composition from the air's molar mass, a dipole from a hash of the name for large fast spinners, a global aurora for the rest.
//
// Keys of BODY (all optional except name):
//   fieldStrength  magnetic field at the dipole's equator on the surface, microtesla (Earth 31). 0 or absent = no dipole.
//   tilt, tiltLongitude  angle (degrees) of the dipole axis from the spin axis, and the longitude (degrees east) it leans towards.
//   offsetX, offsetY, offsetZ  the dipole centre's offset from the body's centre in radii (x: latitude 0 longitude 0, y: north, z: longitude 90 east).
//   polarity       -1: the moment is antiparallel to the spin (Earth: southward interplanetary field drives storms); +1: parallel (Jupiter, Saturn).
//   oval           solar (the oval follows the solar wind), corotation (gas giants: nearly fixed), none.
//   ovalColatitude, ovalWidth  corotation ovals: the main oval's colatitude and half-width, degrees.
//   composition    N2O2, CO2, H2He, N2CH4 (sets the spectrum and what quenches it).
//   aurora, airglow  draw them (True/False); auroraScale, airglowScale  multiply their natural brightness.
//   exosphereTemperature, mesosphereTemperature  kelvin, for the pressure at which collisions quench a line.
//   star           the star whose wind drives it (default: the body's own).
//   CRUSTAL { latitude longitude radius (km) strength }  a magnetised patch of crust (Mars): discrete aurora over it when energetic particles arrive.
//   MOON { name brightness (kR) tail (degrees) lead (degrees) }  a moon inside the magnetosphere that makes a footprint spot and tail.
//
// The node's own keys are the display settings' defaults (the settings window changes them; the realistic values are 1 and an
// aurora photographer's exposure): enabled, arcs, diffuse, pulsating, blackAurora, proton, polarCap, sar, steve, global,
// crustal, footprints, airglow (True/False); auroraBoost, airglowBoost (1 = the model's real brightness); nightIso,
// nightAperture, nightShutter (the camera a dark-adapted view is exposed like: the gain over a bright day's exposure,
// about 200,000 for ISO 1600, f/2, 2 s; only used where the viewer is in the dark); resolution (the march's size as a fraction of the screen); smoothing
// (temporal accumulation).
KSPVE_AURORA
{
    auroraBoost = 1
    airglowBoost = 1
    nightIso = 1600
    nightAperture = 2
    nightShutter = 2
    resolution = 0.5
    smoothing = 0.75

    // ---- Stock Kerbal Space Program ----
    BODY
    {
        // Kerbin is Earth-like.
        name = Kerbin
        fieldStrength = 31
        tilt = 11
        tiltLongitude = 289
        polarity = -1
        oval = solar
        composition = N2O2
    }
    BODY
    {
        // Eve is Venus-like: no global field, a thick carbon dioxide atmosphere; green oxygen over the whole night side in particle events.
        name = Eve
        composition = CO2
    }
    BODY
    {
        // Duna is Mars-like: patches of magnetised crust, a thin carbon dioxide atmosphere.
        name = Duna
        composition = CO2
        CRUSTAL
        {
            latitude = -45
            longitude = 150
            radius = 450
            strength = 1.0
        }
        CRUSTAL
        {
            latitude = -22
            longitude = 232
            radius = 300
            strength = 0.6
        }
        CRUSTAL
        {
            latitude = 18
            longitude = 60
            radius = 250
            strength = 0.4
        }
    }
    BODY
    {
        // Jool is Jupiter-like, with Laythe, Vall and Tylo making footprints.
        name = Jool
        fieldStrength = 417
        tilt = 9.6
        tiltLongitude = 158
        offsetX = -0.03
        offsetY = 0.02
        offsetZ = 0.06
        polarity = 1
        oval = corotation
        ovalColatitude = 16
        ovalWidth = 0.8
        composition = H2He
        exosphereTemperature = 800
        MOON
        {
            name = Laythe
            brightness = 8
            tail = 55
            lead = 10
        }
        MOON
        {
            name = Vall
            brightness = 4
            tail = 30
            lead = 6
        }
        MOON
        {
            name = Tylo
            brightness = 6
            tail = 20
            lead = 3
        }
    }
    BODY
    {
        // Laythe has a weak field of its own, like Ganymede (0.7 microtesla).
        name = Laythe
        fieldStrength = 0.7
        tilt = 5
        tiltLongitude = 100
        polarity = -1
        oval = solar
        composition = N2O2
    }

    // ---- The real Solar System (RSS and the player's Sol pack) ----
    BODY
    {
        // Earth: dipole 31 microtesla tilted 9.3 degrees towards 287 E (the north geomagnetic pole 80.7 N 72.7 W), offset 540 km towards 22 N 141 E.
        name = Earth
        fieldStrength = 31
        tilt = 9.3
        tiltLongitude = 287.3
        offsetX = -0.0611
        offsetY = 0.0318
        offsetZ = 0.0495
        polarity = -1
        oval = solar
        composition = N2O2
    }
    BODY
    {
        // Venus: no intrinsic field; green and red oxygen nightglow, and an aurora of the whole night side in particle events.
        name = Venus
        composition = CO2
    }
    BODY
    {
        // Mars: no global field, but strong crustal fields in the southern highlands (Terra Sirenum, Terra Cimmeria) and Arabia.
        name = Mars
        composition = CO2
        CRUSTAL
        {
            latitude = -53
            longitude = -178
            radius = 500
            strength = 1.0
        }
        CRUSTAL
        {
            latitude = -38
            longitude = 160
            radius = 400
            strength = 0.7
        }
        CRUSTAL
        {
            latitude = -15
            longitude = -160
            radius = 300
            strength = 0.5
        }
        CRUSTAL
        {
            latitude = 12
            longitude = 5
            radius = 250
            strength = 0.3
        }
    }
    BODY
    {
        // Jupiter: 4.17 gauss at the equator, tilted 9.6 degrees, main oval about 16 degrees from the pole; Io, Europa, Ganymede footprints.
        name = Jupiter
        fieldStrength = 417
        tilt = 9.6
        tiltLongitude = 158
        offsetX = -0.03
        offsetY = 0.02
        offsetZ = 0.06
        polarity = 1
        oval = corotation
        ovalColatitude = 16
        ovalWidth = 0.8
        composition = H2He
        exosphereTemperature = 800
        MOON
        {
            name = Io
            brightness = 8
            tail = 60
            lead = 10
        }
        MOON
        {
            name = Europa
            brightness = 4
            tail = 30
            lead = 6
        }
        MOON
        {
            name = Ganymede
            brightness = 6
            tail = 20
            lead = 3
        }
    }
    BODY
    {
        // Saturn: 0.21 gauss, almost axial and offset 0.04 radii north; main oval at about 75 degrees.
        name = Saturn
        fieldStrength = 21
        tilt = 0.0
        offsetY = 0.04
        polarity = 1
        oval = corotation
        ovalColatitude = 14
        ovalWidth = 0.9
        composition = H2He
        exosphereTemperature = 420
    }
    BODY
    {
        // Uranus: 0.23 gauss, tilted 58.6 degrees from the spin axis and offset 0.31 radii.
        name = Uranus
        fieldStrength = 22.8
        tilt = 58.6
        tiltLongitude = 70
        offsetX = 0.12
        offsetY = 0.2
        offsetZ = -0.2
        polarity = -1
        oval = solar
        composition = H2He
        exosphereTemperature = 600
    }
    BODY
    {
        // Neptune: 0.14 gauss, tilted 46.9 degrees and offset 0.55 radii.
        name = Neptune
        fieldStrength = 14.2
        tilt = 46.9
        tiltLongitude = 288
        offsetX = 0.17
        offsetY = -0.46
        offsetZ = 0.27
        polarity = -1
        oval = solar
        composition = H2He
        exosphereTemperature = 600
    }
    BODY
    {
        // Titan has no field of its own and its upper atmosphere is dark at visible wavelengths: nothing is drawn.
        name = Titan
        composition = N2CH4
        aurora = False
        airglow = False
    }
}
