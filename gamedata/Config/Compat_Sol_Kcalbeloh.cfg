// Sol + Kcalbeloh System (+ Principia) with Kcalbeloh's DistanceFactor 0. Only active when both packs are installed.
//
// DistanceFactor 0 makes Kcalbeloh's black hole the root body "Sun" and puts the home star, "Kerbol", in orbit around
// it (Kcalbeloh also forces this layout whenever Principia is installed). Sol replaces the stock system in its own pass,
// after Kcalbeloh's, deleting every body named "Sun" -- which by then is the black hole. So:
//   1. Before Sol's pass the black hole steps aside under a temporary name, so Sol cannot delete it.
//   2. After every other patch, Sol's Sun takes the place of Kcalbeloh's stand-in Kerbol: it is renamed Kerbol (still
//      displayed as the Sun) and orbits the black hole, and Sol's planets and asteroid belts follow it. In this layout
//      Kcalbeloh already points Scatterer's sunlight and sunflare at "Kerbol", so Sol's atmospheres stay lit by the Sun.
//   3. The black hole takes back the name "Sun".
// Sol's Sun orbits the black hole 113.105750 AU (16,920,379,364 km) out: the closest distance at which the planets
// survive 3000 years, found by an N-body search on the CPU and GPU (tools/OrbitCheck). The black hole weighs 5.93 Suns
// (5.96 with Kcalbeloh's own bodies). Tilting Kcalbeloh's star Aralc A by -35 degrees (searched with both big stars
// tilted up to +-35) lets the Sun sit 0.88 AU closer than with no tilt. Over 3000 years from this start Uranus, Neptune
// and Pluto's orbits change at most 9.1%, 14.3% and 37.5% (limits 10/15/40%), also with the start nudged by 0.5 degrees
// and the planets' speeds by 0.01%; 0.6 million km closer, no starting orbit passes. Principia starts from exact states
// for every body (Compat_Sol_Kcalbeloh_PrincipiaState.cfg, generated with the same orbits); these Kopernicus orbits
// match it for the map.

// 1. Protect the black hole from Sol's !Body[Sun].
@Kopernicus:HAS[@KcalbelohSystemSettings:HAS[#DistanceFactor[0],~HomeSwitchEnabled[?rue]]]:NEEDS[SolSystem,KcalbelohSystem]:BEFORE[SolSystem]
{
    @Body:HAS[#identifier[KcalbelohSystem/KcalbelohCenter]]
    {
        @name = KcalbelohCenter
    }
    @Body[Onrefni]
    {
        @Orbit
        {
            @referenceBody = KcalbelohCenter
        }
    }
    @Body[Rouqea]
    {
        @Orbit
        {
            @referenceBody = KcalbelohCenter
        }
    }
    @Body[Iomena]
    {
        @Orbit
        {
            @referenceBody = KcalbelohCenter
        }
    }
    @Body[Uleg]
    {
        @Orbit
        {
            @referenceBody = KcalbelohCenter
        }
    }
    @Body[Maelg]
    {
        @Orbit
        {
            @referenceBody = KcalbelohCenter
        }
    }
    @Body[Sunorc]
    {
        @Orbit
        {
            @referenceBody = KcalbelohCenter
        }
    }
    @Body[AralcA]
    {
        @Orbit
        {
            @referenceBody = KcalbelohCenter
        }
    }
    @Body[Kerbol]
    {
        @Orbit
        {
            @referenceBody = KcalbelohCenter
        }
    }
}

// 2 and 3, after every other patch.
@Kopernicus:HAS[@Body[KcalbelohCenter]]:NEEDS[SolSystem,KcalbelohSystem]:FINAL
{
    // Kcalbeloh's stand-in star (stock look; Sol has removed the stock planets it carried).
    !Body[Kerbol] {}

    // Sol's Sun becomes the home star orbiting the black hole.
    @Body:HAS[#identifier[Sol/Sun]]
    {
        @name = Kerbol
        @Properties
        {
            -sphereOfInfluence = delete
        }
        -Orbit {}
        Orbit
        {
            referenceBody = Sun
            semiMajorAxis = 1.692037936E13 // 113.105750 AU
            eccentricity = 0.0184
            inclination = 144.891851987 // Earth's orbital plane reversed (156.560852), tilted -11.669
            longitudeOfAscendingNode = 204.637681190 // Earth's node + 180, turned +24.634
            argumentOfPeriapsis = 114.711
            meanAnomalyAtEpochD = 287.730012 // 287.002 at Sol's 1950 state, moved to the game's start (1951)
            epoch = 0
        }
    }

    // Sol's planets, dwarf planets and named asteroids follow it.
    @Body[Mercury]
    {
        @Orbit
        {
            @referenceBody = Kerbol
        }
    }
    @Body[Venus]
    {
        @Orbit
        {
            @referenceBody = Kerbol
        }
    }
    @Body[Earth]
    {
        @Orbit
        {
            @referenceBody = Kerbol
        }
    }
    @Body[Mars]
    {
        @Orbit
        {
            @referenceBody = Kerbol
        }
    }
    @Body[Jupiter]
    {
        @Orbit
        {
            @referenceBody = Kerbol
        }
    }
    @Body[Saturn]
    {
        @Orbit
        {
            @referenceBody = Kerbol
        }
    }
    @Body[Uranus]
    {
        @Orbit
        {
            @referenceBody = Kerbol
        }
    }
    @Body[Neptune]
    {
        @Orbit
        {
            @referenceBody = Kerbol
        }
    }
    @Body[Ceres]
    {
        @Orbit
        {
            @referenceBody = Kerbol
        }
    }
    @Body[Pallas]
    {
        @Orbit
        {
            @referenceBody = Kerbol
        }
    }
    @Body[Vesta]
    {
        @Orbit
        {
            @referenceBody = Kerbol
        }
    }
    @Body[Psyche]
    {
        @Orbit
        {
            @referenceBody = Kerbol
        }
    }
    @Body[Ida]
    {
        @Orbit
        {
            @referenceBody = Kerbol
        }
    }
    @Body[Eros]
    {
        @Orbit
        {
            @referenceBody = Kerbol
        }
    }
    @Body[Ryugu]
    {
        @Orbit
        {
            @referenceBody = Kerbol
        }
    }
    @Body[Pluto]
    {
        @Orbit
        {
            @referenceBody = Kerbol
        }
    }
    @Body[Arrokoth]
    {
        @Orbit
        {
            @referenceBody = Kerbol
        }
    }

    // Sol's main belt and Kuiper belt asteroids spawn around the Sun.
    @Asteroid,*
    {
        @Locations
        {
            @Around,*
            {
                @Body,*
                {
                    @body ^= :^Sun$:Kerbol:
                }
            }
        }
    }

    // The black hole is the root "Sun" again, drawn at twice Kcalbeloh's radius: 4.8E9 m, the event horizon size its
    // author gives ("SR: 4.8E9 m"), so it is plainly visible from Earth. Its mass and gravity are unchanged. The
    // scaled-space mesh is cached under KSPVE so that it is built at the new size.
    @Body[KcalbelohCenter]
    {
        @name = Sun
        @cacheFile = KSPVE/Cache/KcalbelohCenter-2x.bin
        @Properties
        {
            @radius *= 2
        }
    }
    // Its four innermost planets move out with it, keeping their distances in horizon radii (their years grow 2.8x;
    // the tidally locked ones spin slower to match).
    @Body[Onrefni]
    {
        @Orbit
        {
            @referenceBody = Sun
            @semiMajorAxis *= 2
        }
    }
    @Body[Rouqea]
    {
        @Orbit
        {
            @referenceBody = Sun
            @semiMajorAxis *= 2
        }
    }
    @Body[Iomena]
    {
        @Orbit
        {
            @referenceBody = Sun
            @semiMajorAxis *= 2
        }
    }
    @Body[Uleg]
    {
        @Orbit
        {
            @referenceBody = Sun
            @semiMajorAxis *= 2
        }
    }
    @Body[Maelg]
    {
        @Orbit
        {
            @referenceBody = Sun
        }
    }
    @Body[Sunorc]
    {
        @Orbit
        {
            @referenceBody = Sun
        }
    }
    @Body[AralcA]
    {
        @Orbit
        {
            @referenceBody = Sun
            @inclination -= 35 // tilted -35 degrees (-2 -> -37) so the Sun can sit closer; the Principia state matches
        }
    }
}

// Principia: in this layout Kcalbeloh's gravity model already lists the black hole as "Sun"; Sol's Sun entry becomes
// Kerbol, and stock Kerbin (listed by Kcalbeloh) does not exist under Sol.
@principia_gravity_model:HAS[@KcalbelohSystemSettings:HAS[#DistanceFactor[0],~HomeSwitchEnabled[?rue]]]:NEEDS[SolSystem,KcalbelohSystem,Principia]:AFTER[KcalbelohSystem]
{
    @body:HAS[#name[Sun],~gravitational_parameter[7.8641019e+20*]]
    {
        @name = Kerbol
    }
    !body:HAS[#name[Kerbin]] {}
}

// Principia: the starting state (Sol's exact bodies plus the black hole and Kcalbeloh's) is in
// Compat_Sol_Kcalbeloh_PrincipiaState.cfg.

// Sol sets each atmospheric body's navball surface/orbit switch height from its Atmosphere's maxAltitude, but 19 of
// Kcalbeloh's bodies give their atmosphere height as "altitude" (the older Kopernicus key). The failed lookups are
// patch errors, which also stop ModuleManager caching its result (slower loads). Compute the same height (80% of the
// atmosphere) from "altitude" first; Sol's patch then leaves those bodies alone.
@Kopernicus:NEEDS[SolSystem,KcalbelohSystem]:BEFORE[SolSystem]
{
    @Body:HAS[@Atmosphere:HAS[~maxAltitude,#altitude]]
    {
        @Properties:HAS[#radius,~navballSwitchRadiusMult,~navballSwitchRadiusMultLow]
        {
            navballSwitchRadiusMult = #$../Atmosphere/altitude$
            @navballSwitchRadiusMult *= 0.8
            @navballSwitchRadiusMult /= #$radius$
            navballSwitchRadiusMultLow = #$navballSwitchRadiusMult$
            @navballSwitchRadiusMultLow *= 0.95
        }
    }
}

// Singularity's background lensing around the black hole, scaled with its doubled radius (see above). Only this layout
// has a Singularity object named Sun alongside Sol.
@Singularity:NEEDS[SolSystem,KcalbelohSystem,Singularity]:FINAL
{
    @Singularity_object[Sun]
    {
        @gravity *= 2
    }
}
