// KSPVE star activity: sunspots, faculae, prominences and loops, the corona, CMEs and a solar wind with CMEs in it.
// All of it is worked out from the game time and a seed, so time warp and reloads agree.
KSPVE_STARS
{
    enabled = True
    // View is a display setting. Eye is the realistic one (the corona is a millionth of the disc and shows only in an
    // eclipse; prominences and loops are a ten-thousandth). HAlpha (a 656.3 nm telescope: prominences and loops bright
    // red-orange, filaments dark on the disc) is the default look. Euv is a 17.1 nm telescope in gold.
    view = HAlpha
    // Multiplies the brightness of prominences, loops, corona and CMEs in the chosen view (1 = the view's own strength).
    visibility = 1
    // Multiplies the contrast of the granulation (1 = real).
    surfaceDetail = 1
    // Scales prominences and loops (display; 1 = real, 2.5 is near the size in the reference picture).
    loopSize = 2.5
    replaceSurface = True

    // Any star without a STAR node gets these (with a seed and cycle phase fixed by its name).
    DEFAULT
    {
        temperature = 5772
        activity = 1
        cyclePeriodYears = 11
        windSpeed = 400000
        drag = 2.0e-11
        cmeRate = 1
        discRadiance = 2
    }

    // The Sun's (and Kerbol's) cycle: 11 years, the game starting on the rising side of a maximum.
    // A star's surface turns at its body's rotation period unless rotationPeriodDays is given here.
    STAR
    {
        body = Sun
        temperature = 5772
        activity = 1
        cyclePeriodYears = 11
        cyclePhase = 0.30
        seed = 1
    }
    STAR
    {
        body = Kerbol
        temperature = 5772
        activity = 1
        cyclePeriodYears = 11
        cyclePhase = 0.30
        seed = 1
    }

    // kind = browndwarf (or a temperature under 2500 K) leaves the surface to the fluids feature.
}
