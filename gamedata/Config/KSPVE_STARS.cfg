// KSPVE prominences and loops, with the solar wind model retained for gameplay.
// Activity is worked out from game time and a seed, so time warp and reloads agree.
KSPVE_STARS
{
    enabled = True
    // View controls the appearance of prominences and loops.
    view = HAlpha
    // Multiplies the brightness of prominences and loops in the chosen view.
    visibility = 1
    // Scales prominences and loops (display; 1 = real, 2.5 is near the size in the reference picture).
    loopSize = 2.5

    // Any star without a STAR node gets these (with a seed and cycle phase fixed by its name).
    DEFAULT
    {
        temperature = 5772
        activity = 1
        cyclePeriodYears = 11
        windSpeed = 400000
        drag = 2.0e-11
        cmeRate = 1
        discRadiance = 2
    }

    // The Sun's (and Kerbol's) cycle: 11 years, the game starting on the rising side of a maximum.
    // A star's surface turns at its body's rotation period unless rotationPeriodDays is given here.
    STAR
    {
        body = Sun
        temperature = 5772
        activity = 1
        cyclePeriodYears = 11
        cyclePhase = 0.30
        seed = 1
    }
    STAR
    {
        body = Kerbol
        temperature = 5772
        activity = 1
        cyclePeriodYears = 11
        cyclePhase = 0.30
        seed = 1
    }

    // kind = browndwarf (or a temperature under 2500 K) leaves the surface to the fluids feature.
}
