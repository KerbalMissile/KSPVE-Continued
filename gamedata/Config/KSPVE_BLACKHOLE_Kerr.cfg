// KSPVE relativistic black hole for KSS2's Kerr (only loaded when KSS2's Kerr system is installed). The same disk and
// jets as Kcalbeloh's, turning 2.5x faster, tilted like KSS2's own Kerr disk (its Singularity config).
// Disk distances are in horizon radii: 3 = innermost stable circular orbit, 1.5 = photon sphere.
KSPVE_BLACKHOLE:NEEDS[SystemKerr]
{
    body = Kerr
    findByMass = False         // Kerr by name (Kcalbeloh's disk goes on the most massive body)
    horizonRadius = 0          // 0 = the body's radius (3.2e9 m at KSS2's 2.5x scale)
    diskInner = 3
    diskOuter = 14
    diskThickness = 0.12
    peakTemperature = 40000
    colorSaturation = 3.4
    brightness = 3.5
    glow = 1
    photonRing = 1
    rotationSpeed = 2.5        // 2.5x Kcalbeloh's disk
    turbulence = 0.8
    spin = 1
    normalX = 50               // KSS2's Kerr accretionDiskNormal
    normalY = -125
    normalZ = 1
    steps = 300
    particles = 1
    debris = 1
    jets = 1.3
    jetLength = 60
    jetWidth = 0.9
    jetSpeed = 0.85
    jetSpiral = 1
    jetTurns = 4
    jetFlow = 30
    jetAbsorb = 0.6
    diskDrag = False           // Kerr's companions TheAll, TheHub and Grav orbit inside the disk
    diskDragTimescale = 0.5
    diskDragMaxAccel = 2000
    diskBuffeting = 0
    diskLight = 1
}
