// KSPVE water defaults: the ocean's look, the sun's glint on it from orbit, and rivers and lakes. Change these live in game with
// Ctrl+Alt+V ("Water"); the window's Save button writes your choices to GameData/KSPVE/PluginData/user.cfg (a KSPVE_WATER_USER
// node), which overrides this file. Each setting is described in KSPVE.Pure/Water/WaterSettings.cs.
// Everything that only exists to look better (waveScale, brightness, runoff, flowAnimation) defaults to the real value, 1.
KSPVE_WATER
{
    enabled = True

    // ---- oceans (KSP's ocean physics, the altitude 0 surface boats float on, is never touched)
    oceans = True
    // Low, Medium, High, Ultra: two to four FFT cascades of 128 to 512 texels, waves from the swell down to a few centimetres.
    oceanQuality = High
    waveScale = 1
    choppiness = 1
    // Wind at 10 m in m/s for the sea state; negative follows the weather's wind (dynamic weather).
    windSpeed = -1
    // How far the wind has blown over the sea (m); 200 km makes a nearly fully developed sea at moderate winds.
    fetch = 200000
    // Radius (m) round the camera drawn as a finely displaced mesh.
    nearRadius = 2500
    brightness = 1
    // Chlorophyll in the sea (mg/m3): 0.03 clearest ocean, 0.1 open ocean, 1 to 10 green coastal water.
    chlorophyll = 0.1
    foam = True
    refraction = True
    orbitalGlint = True
    // A wave breaks once its height reaches this share of the depth (McCowan).
    breakerIndex = 0.78

    // ---- rivers and lakes
    rivers = True
    lakes = True
    // River density: the least discharge (m3/s) at which a channel is drawn; lower draws more and smaller streams.
    riverMinDischarge = 0.5
    // The shallowest basin (m) and the smallest lake (m2) drawn as a lake.
    lakeMinDepth = 1
    lakeMinArea = 20000
    runoff = 1
    // The square of terrain round the camera whose water is worked out (km), and its cells across (cell = width / this).
    windowKm = 32
    gridSize = 256
    // Milliseconds a frame spent reading the terrain (on the main thread: the planet's terrain code is not safe elsewhere).
    samplingBudgetMs = 2
    diskCache = True
    flowAnimation = 1

    // ---- gameplay (changes the game; off)
    lakeBuoyancy = False

    // ---- the liquid a body's sea is made of, when it is not water. Rivers and lakes are only drawn on bodies with a sea of water or
    // of a liquid named here. Without a node, a body's sea is water unless its stock ocean colour has no blue to it, and then that
    // colour is used.
    //
    // LIQUID
    // {
    //     body = Titan
    //     refractiveIndex = 1.29            // liquid methane
    //     color = 0.02, 0.015, 0.01         // deep colour (linear), instead of the water optics
    //     absorption = 0.4, 0.35, 0.3       // 1/m at red, green and blue
    //     surfaceTension = 3.0e-5           // surface tension over density, m3/s2 (methane: 0.0136 N/m over 450 kg/m3)
    // }
}
