// KSPVE tidal disruption event: a star falls into a black hole and is torn apart.
// It runs in a save only when that save's KSPVE file, GameData/KSPVE/PluginData/Saves/<save>.cfg, says tde = on
// (KSPVE creates the file, with tde = off, the first time the save is played). Any key below can also be set in that
// file, for that save alone.
//
// The physics runs in the frame the black hole is drawn in: its drawn horizon is a real Schwarzschild horizon, so
// Kcalbeloh is a hole of a few million Suns (like Sgr A*). Orbits are exact Schwarzschild geodesics; the debris'
// energy spread and fallback are calibrated to hydrodynamic simulations (Guillochon & Ramirez-Ruiz 2013).
// Kcalbeloh has no disk of its own (diskFromTde in its KSPVE_BLACKHOLE): the star comes in along the disk's plane on a
// deep orbit, its returning debris settles at ~11 horizon radii and spreads into the hole's disk over ~2-3 months, and
// the jets launch once that disk is half built.
KSPVE_TDE
{
    starMass = 40              // Suns: a big O-type star
    starRadius = 15            // solar radii
    starTemperature = 40000    // K
    polytropeIndex = 3         // internal structure: 3 = radiative envelope (the Sun, massive stars), 1.5 = fully convective
    periapsis = 5              // closest approach, horizon radii; the debris settles at about twice this (0 = use beta)
    beta = 2                   // tidal radius / periapsis, used only when periapsis = 0
    startDistance = 6          // where the star starts falling in, in tidal radii
    timeScale = 1              // playback speed: 1 = real time (the disk forms over ~2-3 months); 0.5 = twice as slow
    inclination = 0            // tilt of the star's orbit from the disk, degrees: 0 = in its plane, so it builds that disk; -1 = random
    node = -1                  // degrees; -1 = random
    periapsisAngle = -1        // degrees; -1 = random
    outflowFraction = 0.5      // share of the shocked gas blown out; the rest forms the disk
    efficiency = 0.1           // radiative efficiency of accretion
    viscousAlpha = 0.1         // how fast the new disk drains into the hole
    envelopeOpacity = 0.00001  // how opaque the outflow's photosphere is drawn: 1 = physical (at peak it hides everything); this keeps it a glow round the hole
    starGlow = 1               // display boost for the star (a hot star needs none)
    streamGlow = 40            // display boost for the debris stream once it has cooled (~100x dimmer than the disk)
    lineVisibility = 0.35      // display aid: least share of a pixel the thin stream covers (0 = physical)
    renderRadius = 4000        // debris further than this from the hole (horizon radii) is not drawn
}
