// KSPVE seasons, climate and snow. The player's changes from the settings window are kept in PluginData/user.cfg
// (KSPVE_CLIMATE_USER); this file holds the defaults, and per body overrides.
KSPVE_CLIMATE
{
	// Snow, glaciers and sea ice blended into the planets seen from space.
	scaledSnow = true
	// Snow on the terrain around the craft (the deferred G-buffer, before lighting).
	localSnow = true
	// Largest width (texels) of a scaled planet's texture with snow in it, and how many planets have one at a time.
	scaledResolution = 4096
	scaledBodies = 3
	// Display settings: snow's albedo (fresh snow is 0.8 to 0.9), sparkle (0 is none), craft kept clear of snow.
	snowAlbedo = 0.86
	snowSparkle = 0
	keepVehiclesClear = true
	// The weather of the last few days (of the body's own days) adds fresh snow; 0 turns it off.
	recentWindowDays = 8

	// Per body overrides (all optional):
	//   pretendTilt      degrees, or "off": tilt the axis for the seasons (a display setting: stock planets have none)
	//   moisture         how wet the world is against Earth (default: 1 with an ocean, 0.5 with clouds, else 0.1)
	//   meanTemperature  the global mean surface temperature in kelvin (default: the game's own sea level temperature)
	//   enabled          false: no seasons, snow or ice on this body
	// BODY
	// {
	// 	name = Kerbin
	// 	pretendTilt = 23.44
	// }
}
