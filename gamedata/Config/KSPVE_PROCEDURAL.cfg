// KSPVE's procedural objects: belts, Kuiper belts and comet tails placed by rule round every star of any planet pack, so
// a system needs no hand-written KSPVE_BLACKHOLE nodes. Off by default; switch it on here or in the settings window
// (Ctrl+Alt+V), where a placed object can be kept to save and edit it. Bodies that already have an object of a kind keep it.
// Each setting is described in KSPVE.Pure/Space/ProceduralObjects.cs.

KSPVE_PROCEDURAL
{
    enabled = False
    seed = 1
    belts = True                // an asteroid belt in each star's widest gap between neighbouring planets' orbits
    beltChance = 1
    beltMinGap = 1.8            // the least ratio between the orbits either side (Mars to Jupiter is 3.4)
    planetMinRadius = 100000    // smaller bodies (dwarf planets, asteroids) do not clear a gap
    outerDisks = True           // a debris disk beyond the outermost planet
    outerDiskChance = 0.7
    comets = True               // tails on small bodies on eccentric orbits round a star
    cometMaxRadius = 25000
    cometMinEccentricity = 0.3
    variety = 0.5
    starTemperature = 5800
}
