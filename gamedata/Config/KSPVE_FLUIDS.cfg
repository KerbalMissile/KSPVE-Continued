// KSPVE fluid-dynamics atmospheres: brown dwarf clouds (and, if you want them, gas giants and hot Jupiters).
//
// A barotropic vorticity model on the rotating sphere (Coriolis and the beta effect from the body's real rotation, small-scale
// stirring standing in for convection, drag and radiative damping) is spun up when the body is first loaded and then follows the
// game clock. It makes zonal jets near the Rhines scale, bands and long-lived vortices (Showman & Kaspi 2013; Zhang & Showman
// 2014). Two or three cloud decks per body (L dwarfs: silicates and iron; T: KCl/ZnS, Na2S, MnS; Y: water ice over salts)
// ride on the flow and clear or thicken with its temperature anomalies by Clausius-Clapeyron. The shader shows each deck at
// its own temperature as a blackbody through the sodium and potassium absorption above it: the clouds on top obscure the
// glowing layers below, and gaps let them through.
KSPVE_FLUIDS
{
    enabled = True

    // Display setting: multiplies the radiance of brown dwarfs and hot planets. 1 is realistic: a 1500 K L dwarf is about four
    // millionths as bright as the Sun's disc in visible light, a 900 K T dwarf about a billionth. Raise it (the settings window
    // has it in stops, 2^x) to see them without waiting for the eye to adapt.
    brightnessBoost = 1

    // eye (realistic) or thermalinfrared (a 5 micrometre thermal camera as Gemini and Juno image Jupiter, in a false-colour ramp: the hot deep layers glow through gaps in the clouds; gas giants show this way too).
    view = eye

    // Brown dwarfs found in the game (stars with kind = browndwarf in KSPVE_STARS, or under 2500 K) get an atmosphere.
    brownDwarfs = True
    // Gas giants that have no EVE clouds get the same simulation (off: they keep what the game draws).
    gasGiants = False
    // Bodies named below with type = hotjupiter (tidally locked: hot day side, cold night side, eastward equatorial jet).
    hotJupiters = True

    // The simulation runs on one background thread. workShare is the share of a core it may use once running (spin-up takes
    // all of it). Under time warp it takes as many steps as that allows and falls behind the game clock by up to maxLagDays,
    // then jumps ahead without integrating (the flow is statistically steady: the weather simply changes).
    workShare = 0.35
    maxLagDays = 20

    // Any body that gets an atmosphere without a BODY node of its own is described by this.
    DEFAULT
    {
        // Spectral truncation: the flow resolves wavelengths down to about 2 pi a / resolution (42 is a 64 x 128 grid).
        resolution = 42
        // Longitudes of the cloud grid (a power of two; it has half as many latitudes).
        tracerResolution = 256
        // Multiplies the stirring power (the estimate is 3e-4 of the heat flux over the 10 bar layer) and the temperature
        // anomalies that make and clear the clouds.
        forcing = 1
        patchiness = 1
    }

    // type: L, T, Y (brown dwarfs), giant, hotjupiter. Without a type it follows temperature: L above 1300 K, T 500 to 1300 K,
    // Y 250 to 500 K, below that a giant planet. temperature is the effective temperature (for a hot Jupiter the day-side
    // equilibrium temperature). The rotation comes from the body; rotationPeriodHours overrides it, and is used when the body
    // does not rotate (brown dwarfs spin in 1.5 to 10 hours). seed = 0 takes the body's name.
    //
    // Kcalbeloh pack: Maelg is a brown dwarf (about 0.6 Jupiter masses, luminosity 1.8 of Kerbol's 1360). Mark it
    // kind = browndwarf in KSPVE_STARS too, so the star feature leaves its surface to this one.
    BODY
    {
        body = Maelg
        type = L
        temperature = 1400
    }

    // Examples (not enabled):
    // BODY
    // {
    //     body = SomeTDwarf
    //     type = T
    //     temperature = 900
    //     rotationPeriodHours = 4.5
    //     forcing = 1.5
    //     seed = 12
    // }
    // BODY
    // {
    //     body = SomeHotJupiter
    //     type = hotjupiter
    //     temperature = 2000        // day-side equilibrium temperature
    //     jetSpeed = 2500           // eastward equatorial jet, m/s (default 2000 sqrt(T / 1500 K))
    // }
}
