// KSPVE relativistic black hole for the Kcalbeloh system (only loaded when KcalbelohSystem is installed).
// It starts bare: the disk and jets below are what a tidal disruption event builds, over a couple of months.
// Disk distances are in horizon radii: 3 = innermost stable circular orbit, 1.5 = photon sphere.
KSPVE_BLACKHOLE:NEEDS[KcalbelohSystem]
{
    body = Kcalbeloh
    diskFromTde = True         // no disk or jets until a tidal disruption builds them (a save's tde = on; see KSPVE_TDE.cfg)
    findByMass = True          // the disk goes on the most massive body, whatever planet packs rename it to
    minMass = 5e30             // kg; 2.5 Suns, so no ordinary star ever gets a disk
    horizonRadius = 0          // event horizon in metres; 0 = Kcalbeloh's radius, which its author gives as the
                               // Schwarzschild radius (so its shadow looks 2.6x that, as a real black hole's does)
    diskInner = 3
    diskOuter = 14             // 3.4e10 m
    diskThickness = 0.12     // thick, cloudy torus
    peakTemperature = 40000    // blue; 6000 gives the gold disk, ~25000 a pale blue-white one
    colorSaturation = 3.4      // 1 = plain blackbody colour (2.2 suits the gold disk)
    brightness = 3.5
    glow = 1
    photonRing = 1
    rotationSpeed = 1          // 1 = one turn every ~8 s
    turbulence = 0.8
    diskStreaks = 1            // seen from above: long swirling streaks (fading in from 10 degrees up; the side is unchanged)
    spin = 1
    normalX = 0.5              // same disk orientation as Kcalbeloh's Singularity config
    normalY = 10
    normalZ = 1
    steps = 300
    particles = 1              // sparks of white-hot matter riding in the disk
    debris = 1                 // dark chunks of debris riding in the disk
    jets = 1.3                 // relativistic jets along the spin axis (0 = off)
    jetLength = 60             // horizon radii
    jetWidth = 0.9             // radius = jetWidth * (distance along the axis)^0.55
    jetSpeed = 0.85            // fraction of light speed; the approaching jet is beamed brighter
    jetSpiral = 1              // solid spiral core, swirled with streaks (0 = plain column)
    jetTurns = 4               // turns the swirl makes along each jet
    jetFlow = 30               // outward flow of the pattern, horizon radii per second at mid-length
    jetAbsorb = 0.6            // jet gas absorbs light behind it, for depth (0 = pure glow)
    diskDrag = True            // gas in the disk drags vessels toward co-rotating with it
    diskDragTimescale = 0.5    // seconds to match the gas speed at full density (the disk is massive)
    diskDragMaxAccel = 2000    // strongest pull at the outer edge, m/s^2 (2 km/s every second); up to ~3x at the inner edge
    diskBuffeting = 1          // turbulent shaking of vessels inside the disk (0 = off)
    diskLight = 1              // how strongly the disk's glow lights nearby vessels (0 = off)
}
