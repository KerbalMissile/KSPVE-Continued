// Particle structures: clumps, puffs and grains on real orbits about a body and its star (src/KSPVE.Pure/Space/Particles).
// Nothing is drawn until a node is uncommented here or one is added in the settings window ("Particle structures").
//
// Each KSPVE_STRUCTURE node needs a body and a kind; everything else is optional and the values below are the defaults of the
// preset named by "preset" (or of the kind), so a node only lists what it changes:
//   kind    = EvaporatingPlanet | ImpactDebris | Synestia | SuperPuff | RingingMoon | RubblePile | ToroidalPlanet (speculative)
//   preset  = Hot Jupiter evaporating
//             Disintegrating rocky planet (KIC 12557548 b)
//             Chthonian core
//             Like the reference                         (a body shedding a stream of separate bright clumps)
//             Impact debris ball (like the reference)    (a lumpy cloud of soft blobs, lavender lit side, hot orange specks in the shadow)
//             Giant-impact debris cloud
//             Synestia (Lock and Stewart)
//             Synestia with a moon condensing
//             Super-puff (Kepler-51 d)
//             Moon torn into a ring
//             Rubble pile shedding
//             Contact binary splitting
//             Toroidal planet (speculative)              (also needs speculative = 1)
//   lightSource = a star's body name (default: the nearest star above the body)
//   enabled = True | False
// The rest are the settings listed in the window (their keys are in StructureSettings.cs): count, seed, brightness,
// visibilityBoost (a display aid, 1 is the real brightness), minPixels, sizeScale, albedo, selfShadow, starTemperature,
// ageRate (how fast stripping, cooling and break-up go compared with game time; 0 freezes it), startAgeHours, atmosphereLeft,
// escapeEfficiency, ejectionSpeed, streamHours, gasTailHours, dustTailHours, clumpShare, gasShare, l1Share, l2Share, clumpRadius,
// clumpBeta, gasBeta, grainSizeUm, grainDensity, tailDensity (display), glowGain (display), clumpColor, gasColor, dustColor ...
//
// An evaporating planet on a gas giant orbiting a star:
//
// KSPVE_STRUCTURE
// {
//     body = Jool
//     kind = EvaporatingPlanet
//     preset = Hot Jupiter evaporating
// }
//
// A moon coming apart into a ring round its planet:
//
// KSPVE_STRUCTURE
// {
//     body = Kerbin
//     kind = RingingMoon
//     preset = Moon torn into a ring
// }

// (KSP warns about a config file with no nodes in it; this empty one, which nothing reads, keeps it quiet.)
KSPVE_STRUCTURE_EXAMPLES
{
}
