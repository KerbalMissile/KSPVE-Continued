// KSPVE camera post-processing defaults. Change these live in game with Ctrl+Alt+V;
// the window's Save button writes your choices to GameData/KSPVE/PluginData/user.cfg,
// which overrides this file. Ctrl+Alt+K toggles all post-processing.
KSPVE_POST
{
    enabled = True
    // None, Rolloff (keeps KSP's look, rolls off HDR highlights), Neutral, AgX, Aces
    tonemapper = Rolloff
    exposure = 0

    autoExposure = False
    autoExposureKey = 0.18
    autoExposureMinEv = -2
    autoExposureMaxEv = 1.5
    autoExposureDarkSpeed = 1
    autoExposureBrightSpeed = 3

    bloom = True
    bloomIntensity = 0.25
    bloomThreshold = 0.8
    bloomKnee = 0.5
    bloomScatter = 0.7
    lensDirt = 0
    spikes = 0
    sensorSmear = 0

    temperature = 0
    tint = 0
    contrast = 1
    saturation = 1
    vibrance = 0
    nightVision = 0

    vignette = 0.2
    grain = 0.05
    chromaticAberration = 0
    sharpen = 0.3
    broadcast = 0

    // Experimental: not yet verified in game, so off by default.
    ambientOcclusion = False
    aoIntensity = 0.8
    aoRadius = 1.5
    contactShadows = False
    contactShadowLength = 1
    motionBlur = False
    motionBlurStrength = 0.5
    depthOfField = False
    dofFocusDistance = 0
    dofStrength = 0.5

    // Relativistic black holes (see KSPVE_BLACKHOLE_*.cfg)
    blackHoles = True
    blackHoleBrightness = 1
    blackHoleResolution = 0.5      // render scale: 0.5 = half resolution (about 4x faster), 1 = full
}
