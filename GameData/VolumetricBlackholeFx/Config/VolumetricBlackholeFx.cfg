// Volumetric Blackhole Fx: mod-wide settings. Each black hole is a VOLUMETRIC_BLACKHOLE node (see the other configs).
// The settings window (Ctrl+Alt+V) changes all of this live; its Save button keeps your changes in PluginData/user.cfg.
VOLUMETRIC_BLACKHOLE_FX
{
    enabled = True             // draw the black holes (disk drag and disk light go with them)
    logLevel = Info
    brightness = 1             // brightness multiplier for every accretion disk
    renderScale = 0.5          // 0.5 draws the holes at half resolution (about 4x faster), 1 at full resolution
}
