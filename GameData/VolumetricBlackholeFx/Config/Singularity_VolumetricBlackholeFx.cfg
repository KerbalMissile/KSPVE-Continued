// Volumetric Blackhole Fx draws Kcalbeloh's accretion disk volumetrically, with relativistic Doppler beaming and redshift.
// This turns off only Singularity's flat textured disk for Kcalbeloh; Singularity keeps its background lensing.
// Delete this file to get Singularity's disk back.
@Singularity:HAS[@Singularity_object[Kcalbeloh]]:NEEDS[Singularity,KcalbelohSystem]:FINAL
{
    @Singularity_object[Kcalbeloh]
    {
        @useAccretionDisk = False
    }
}

// KSS2's Kerr: this mod draws its disk too (VolumetricBlackhole_Kerr.cfg).
@Singularity:HAS[@Singularity_object[Kerr]]:NEEDS[Singularity,SystemKerr]:FINAL
{
    @Singularity_object[Kerr]
    {
        @useAccretionDisk = False
    }
}

// With DistanceFactor = 0 (or Principia) Kcalbeloh becomes the root body "Sun", and its Singularity object is renamed to match.
@Singularity:HAS[@Singularity_object[Sun]]:NEEDS[Singularity,KcalbelohSystem]:FINAL
{
    @Singularity_object[Sun]
    {
        @useAccretionDisk = False
    }
}
