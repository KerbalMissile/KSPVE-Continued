// AC-1 (radius 1800 m) round Nova Kirbani B: proper tails, pushed away from its star, the dust tail curving back along
// its orbit. KSS2's two flat tail textures are removed below.
KSPVE_BLACKHOLE:NEEDS[SystemNovaKirbani]
{
    body = AC-1
    kind = Comet
    horizonRadius = 10000000    // coma 20,000 km; tails fading over 600,000 and 350,000 km
}

@Kopernicus:NEEDS[SystemNovaKirbani]:AFTER[KSS2]
{
    @Body[AC-1]
    {
        !Rings {}
    }
}

