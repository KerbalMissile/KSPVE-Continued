// --------------------------------------------------------------------------- KSPVE's Sol + Kcalbeloh cluster layouts
// They remove the barycentres (each pair of stars becomes a real binary round its A star), so the circumbinary objects
// move to the A star, their sizes turned into its radii (both scale alike).
@KSPVE_BLACKHOLE:HAS[#body[NovaKirbaniBarycenter]]:NEEDS[SolSystem,KcalbelohSystem,KSS2]:FINAL
{
    @body = NovaKirbaniA
    @diskInner *= 11.7384       // 1e9 / 85190235
    @diskOuter *= 11.7384
}

@KSPVE_BLACKHOLE:HAS[#body[SeereonBarycenter]]:NEEDS[SolSystem,KcalbelohSystem,KSS2,SystemSeereon]:FINAL
{
    @body = SeereonA
    @diskInner *= 0.083932      // 1e7 / 119143774
    @diskOuter *= 0.083932
}
