// KSPVE objects for KSS2's systems: asteroid belts, debris disks, comet tails, nebulae and magnetic fields, all drawn by
// KSPVE's shader (no vessels, nothing for KSP to track). Optional: copy this file into GameData/KSPVE/Config to use it.
//
// Sizes are in the star's own radius (the length unit, horizonRadius = 0), taken from KSS2's asteroid spawn zones
// (Celestials/_AsteroidBelts and _Asteroids*.cfg) over the radius in the body's file, so they follow KSS2's Scale setting
// (it scales radii and orbits alike). Each system's nodes need that system's folder.
//
// Kerr: the galactic-centre black hole's circumnuclear rubble ring and debris disk; The All wrapped in a dark nebula
//       threaded with field lines.
// Nova Kirbani: a belt round each sun, the circumbinary belt, Proksimus' inner belt and outer debris disk, and AC-1's tails.
// Aethera: the red dwarf's inner dust ring, its dusty main belt and outer belt, Aten's and Phoibe's tails (the system is
//       retrograde: normals point down).
// Kormin: the brown dwarf's plasma torus and magnetic field, its main and stirred belts, the outer debris disk.
// Orbel: the giant's ring of fractured moons and the faint dust shell of its wind.
// Seereon: the white dwarf's ion trail streaming away from Seereon A, the circumbinary debris disk and outer belt.

// ------------------------------------------------------------------------------------------------------------- Kerr
// Kerr's radius 1269011640.19 m. KSPVE_BLACKHOLE_Kerr.cfg draws the hole itself (slot 0); these are slots 1 and 2.
// Its disk's normal (50, -125, 1) is kept for both, lit by the hole's blue-white inner disk.

KSPVE_BLACKHOLE:NEEDS[SystemKerr]
{
    body = Kerr
    kind = AsteroidBelt
    diskInner = 27.6            // Kerr_InnerRubbleRing 3.5e10 to 1.2e11 m
    diskOuter = 94.6
    diskThickness = 0.1         // inclinations to 12 degrees
    normalX = 50
    normalY = -125
    normalZ = 1
    starTemperature = 20000
    dust = 0.012
    dustColor = 0.85, 0.8, 0.75
    outerDustColor = 0.7, 0.68, 0.72
    rocks = 0.18
    rockColor = 0.85, 0.83, 0.8
    rockAlbedo = 0.25
}

KSPVE_BLACKHOLE:NEEDS[SystemKerr]
{
    body = Kerr
    kind = DebrisDisk
    diskInner = 94.6            // Kerr_MainDebrisDisk, the circumnuclear debris disk: 1.2e11 to 9.55e11 m
    diskOuter = 752.6
    diskThickness = 0.15        // inclinations to 35 degrees
    edgeSoftness = 1.4
    normalX = 50
    normalY = -125
    normalZ = 1
    starTemperature = 20000
    dust = 0.05
    dustColor = 0.8, 0.72, 0.66
    outerDustColor = 0.55, 0.5, 0.62
    rocks = 0.2
    rockSpacing = 0.004
    rockSpread = 1.5
    clumps = 0.9
    spiralArms = 2              // tidally stirred by the hole
    spiralStrength = 0.6
    spiralWinding = 2.5
    lightFalloff = 1            // display aid: the hole's light would leave the outer disk 60x dimmer than the inner
}

// The All (radius 15707963 m): a dark star "maintaining matter", its light deep blue. Shrouded in a dark nebula 120 of
// its radii across (well inside its orbit round Kerr) with glowing field lines.
KSPVE_BLACKHOLE:NEEDS[SystemKerr]
{
    body = TheAll
    kind = Nebula
    diskOuter = 120
    dust = 0.6
    colorA = 0.18, 0.28, 1
    colorB = 0.55, 0.2, 1
    filaments = 2
    dustLanes = 2.2
    cloudFill = 1.0
    cloudWarp = 1.3
    shell = 0.35
    fieldLines = 0.7
    fieldShells = 8
    fieldLineCount = 12
    brightness = 0.8
}

